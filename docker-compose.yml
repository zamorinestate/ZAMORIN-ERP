# NOTE: no top-level `version:` key — it is obsolete in Compose v2 and emits a
# warning ("the attribute `version` is obsolete").
services:
  mongodb:
    image: mongo:7.0
    container_name: zamorin-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: zamorin_cafe_erp
    entrypoint: [ "/bin/sh", "-c", "mongod --replSet rs0 --bind_ip_all & MONGOD_PID=$$!; until mongosh --eval 'rs.status().ok || rs.initiate({_id: \"rs0\", members: [{_id: 0, host: \"127.0.0.1:27017\"}]})' >/dev/null 2>&1; do sleep 1; done; echo 'MongoDB Replica Set rs0 initialized'; wait $$MONGOD_PID" ]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand(\"ping\").ok' --quiet"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: zamorin-redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zamorin-backend-api
    restart: always
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      TZ: Asia/Kolkata
      MONGODB_URI: mongodb://mongodb:27017/zamorin_cafe_erp?replicaSet=rs0
      # NODE_ENV=production enables cluster mode, which hard-requires a real
      # Redis (redisClientFactory.validateClusterRequirements throws
      # CLUSTER_REDIS_CONFIG_MISSING otherwise). In-memory fallback is forbidden.
      REDIS_URL: redis://redis:6379
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,${PRODUCTION_FRONTEND_URL:-http://localhost:3000}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-zamorin_production_access_secret_32_chars_min}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      INITIAL_ORGANISATION_ID: ZAMORIN
      INITIAL_MASTER_NAME: Zamorin Master
      INITIAL_MASTER_EMAIL: ${INITIAL_MASTER_EMAIL:-master@zamorincafe.com}
      INITIAL_MASTER_PASSWORD: ${INITIAL_MASTER_PASSWORD:-ZamorinMaster2026!}
      PRIVATE_STORAGE_DRIVER: local
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: caddy:2-alpine
    container_name: zamorin-frontend-ui
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/usr/share/caddy:ro
    command: caddy file-server --listen :3000

volumes:
  mongo_data:
  redis_data:
