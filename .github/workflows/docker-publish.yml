name: Docker

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Explicit container image tag to publish (e.g., v2.0.0)'
        required: true
        default: 'latest'
        type: string
      confirm_publish:
        description: 'Confirm publication to GitHub Container Registry (ghcr.io)'
        required: true
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Validate image tag input safely before any metadata or publishing action
      - name: Validate image tag
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "::error::Invalid image tag format"
            exit 1
          fi

      # Install cosign only when manual publication is confirmed
      - name: Install cosign
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_publish == true }}
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20 # v3.5.0
        with:
          cosign-release: 'v2.2.4'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      # Log into GHCR registry only when manual publication is confirmed
      - name: Log into registry ${{ env.REGISTRY }}
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_publish == true }}
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract Docker metadata
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934 # v5.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.image_tag || 'pr-validation' }}

      # Build container image (push ONLY if workflow_dispatch with confirmed publish)
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: .
          push: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_publish == true }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Sign published image using cosign keyless OIDC certificate
      - name: Sign the published Docker image
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_publish == true }}
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}
